<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_name }}</title>
  </head>
  <body>
    <ul>
      {% for m in menu %}
        <li style="display: inline-block;">
          <a href="{{ m.path }}">{{ m.name }} /</a>
        </li>
      {% endfor %}
    </ul>
    <h1>"Изучаем django"</h1>
    {% comment 'hello' %}
    {% endcomment %}
    <strong>Автор</strong>: <i>{{ last_name|upper }}.{{ first_name }}.{{ middle_name }}</i>
    <p>
      <a href="/items">Список товаров</a>
    </p>
  </body>
</html>
